name: Release

# 四平台产物在这里构建并挂到 GitHub Release；再由 co0ontty/wand-render-bin 的
# sync workflow 拉取并提交（那边用自己仓库的 GITHUB_TOKEN，所以不需要跨仓库 PAT）。
#
# 为什么 Linux 用 musl：Server 可能跑在任意发行版上，动态链接 glibc 会在旧发行版上
# 直接起不来（GLIBC_x.y not found）。所以 .cargo/config.toml 里开 crt-static。
#
# 为什么两个 darwin 目标都在 arm64 runner 上编：x86_64-apple-darwin 可以交叉编译，
# 不依赖 Intel runner 的可用性（macos-13 正在退役）。
#
# Windows 不在这里出包：协议要求 Render 独立寻址与独立升级，Windows 需要命名管道
# 而不是 Unix socket，PTY 要换 ConPTY，SIGHUP/SIGWINCH 语义也不存在 ——
# 那是实现工作，不是加一个 matrix 条目。当前 Windows 上启动会给出明确错误并回落到
# legacy terminald（见 docs/render-protocol.md §9.5.1、README 的支持矩阵）。

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本（必须等于 Cargo.toml 的 workspace version）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            cross: false
          - triple: darwin-x64
            runner: macos-14
            target: x86_64-apple-darwin
            cross: true
          - triple: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: false
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        # 版本只有一个真源：workspace 的 Cargo.toml。后面所有路径都用它，避免 glob 撞上残留旧目录。
        run: |
          set -euo pipefail
          echo "value=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install target
        run: rustup target add "${{ matrix.target }}"

      - name: Toolchain
        run: rustup show active-toolchain && rustc --version

      # musl 目标需要一个 musl 链接器；不装的话 cargo 会因为找不到 cc 而失败。
      - name: Install musl toolchain
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # Ubuntu 的 musl-tools 提供的 musl-gcc 是针对 runner 自身架构的，
          # 所以 arm64 目标要放在 arm64 runner 上（矩阵里已经这么配），链接器名都是 musl-gcc。
          echo "MUSL_CC=musl-gcc" >> "$GITHUB_ENV"

      # 测试在宿主平台上跑（真 PTY 集成测试必须在能 fork PTY 的平台上执行）。
      # darwin-x64 的交叉编译产物另有一步 Rosetta 冒烟。
      - name: Test
        run: cargo test --locked --all-targets

      - name: Package
        env:
          TRIPLE: ${{ matrix.triple }}
        run: scripts/package-release.sh

      - name: Smoke test the packaged binary
        env:
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          BIN="dist/v$VERSION/$TRIPLE/wand-render"
          test -x "$BIN" || { echo "packaged binary missing: $BIN" >&2; exit 1; }
          echo "smoke: $BIN"
          if [ "$TRIPLE" = "darwin-x64" ]; then
            # 交叉编译产物在 arm64 runner 上通过 Rosetta 执行，这是「交叉编译结果真能跑」的证据。
            arch -x86_64 "$BIN" --version
          else
            "$BIN" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.triple }}
          path: dist/fragments/${{ matrix.triple }}.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.triple }}
          path: dist/v${{ steps.version.outputs.value }}/${{ matrix.triple }}/
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          echo "value=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          path: dist/fragments
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/binaries
          merge-multiple: true

      - name: Restore dist/v<version>/<triple> layout
        # download-artifact 会抹平 v*/ 那一层，这里按目录名重建，保持与本地布局一致。
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p "dist/v$VERSION"
          for dir in dist/binaries/*/; do
            cp -R "$dir" "dist/v$VERSION/$(basename "$dir")"
          done
          ls -R "dist/v$VERSION"

      - name: Assert all supported triples are present
        # 少一个平台就发版 = 那个平台的用户静默回落到 legacy，这条必须在发布之前断掉。
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          MISSING=""
          for TRIPLE in $(bash -c '. scripts/triples.sh; supported_triples'); do
            if [ ! -x "dist/v$VERSION/$TRIPLE/wand-render" ]; then
              MISSING="$MISSING $TRIPLE"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "missing artifacts for:$MISSING" >&2
            exit 1
          fi
          echo "all supported triples present"

      - name: Build release manifest and checksums
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          node scripts/update-manifest.mjs --bin-dir dist/binstage --dist-dir dist
          cp dist/binstage/manifest.json "dist/manifest.json"
          # 同样不假设 shasum 存在：ubuntu runner 上有 sha256sum。
          ( cd "dist/v$VERSION" && find . -name wand-render -type f | sort | while read -r file; do
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$file"; else shasum -a 256 "$file"; fi
            done ) > "dist/checksums.txt"
          cat dist/manifest.json
          cat dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # 每个平台一个 tar.gz + 顶层 manifest/checksums：
          # wand-render-bin 的 sync workflow 就按这个结构下载与校验。
          mkdir -p dist/assets
          for TRIPLE in $(bash -c '. scripts/triples.sh; supported_triples'); do
            tar -czf "dist/assets/wand-render-$VERSION-$TRIPLE.tar.gz" -C "dist/v$VERSION" "$TRIPLE"
            cp "dist/v$VERSION/$TRIPLE/wand-render.sha256" "dist/assets/wand-render-$VERSION-$TRIPLE.sha256"
          done
          cp dist/manifest.json dist/assets/manifest.json
          cp dist/checksums.txt dist/assets/checksums.txt
          ls -l dist/assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/assets/* --clobber
          else
            gh release create "$TAG" --title "wand-render $VERSION" --generate-notes dist/assets/*
          fi
